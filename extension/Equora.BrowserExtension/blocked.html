<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>网站使用限制 · Equora</title>
<style>
:root { color-scheme: light dark; font-family: 'Segoe UI','Microsoft YaHei',sans-serif; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f3f3f3; color:#202020; }
main { max-width:560px; padding:48px; background:#fff; border-top:4px solid #c32f37; }
svg { width:40px; height:40px; fill:none; stroke:currentColor; stroke-width:1.5; }
h1 { font-weight:400; font-size:30px; } p { line-height:1.7; } #domain { font-size:20px; overflow-wrap:anywhere; }
.actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
button { border:1px solid #888; border-radius:0; padding:12px 20px; font:inherit; background:#e5e5e5; color:#202020; cursor:pointer; }
button:first-child { background:#c32f37; color:white; border-color:#c32f37; } small { display:block; margin-top:24px; color:#666; }
@media(prefers-color-scheme:dark) { body { background:#202020; color:#eee; } main { background:#2b2b2b; } small { color:#bbb; } }
</style></head><body><main>
<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 14V9a8 8 0 0 1 16 0v5M5 14h22v16H5zM16 20v5"/></svg>
<h1>此网站暂时不可使用</h1><p id="domain"></p><p>已触发你在 Equora 中设置的时段、专注或每日使用时长限制。</p>
<div class="actions"><button id="back">关闭此页面</button><button id="allow">临时允许 5 分钟</button></div>
<small>可在桌面端“使用限制”中调整规则。临时允许后将打开网站首页。</small>
</main><script src="blocked.js"></script></body></html>
