name: desktop-ci

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-ci.yml']
  workflow_dispatch:

env:
  EQUORA_VCPKG_BASELINE: e6f9e70a29a3e80a1fc510d8503304315447112f

jobs:
  windows-dotnet:
    name: Windows (dotnet build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # C# 互操作测试需要 equora_capi.dll:先构建原生层。
      - name: Build native CApi (Release)
        working-directory: native
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) { $env:VCPKG_ROOT = 'C:\vcpkg' }
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          git -C $env:VCPKG_ROOT fetch origin
          git -C $env:VCPKG_ROOT checkout --detach $env:EQUORA_VCPKG_BASELINE
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          cmake --preset win-x64-release
          cmake --build --preset win-x64-release --target equora_capi

      - name: Build desktop solution
        working-directory: desktop
        run: dotnet build Equora.slnx -c Release

      - name: Run interop tests
        working-directory: desktop
        run: dotnet test Equora.App.Tests/Equora.App.Tests.csproj -c Release --no-build
