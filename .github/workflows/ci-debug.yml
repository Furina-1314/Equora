name: ci-debug

on: workflow_dispatch

jobs:
  crash-stack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure & build (RelWithDebInfo)
        working-directory: native
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) { $env:VCPKG_ROOT = 'C:\vcpkg' }
          git -C $env:VCPKG_ROOT fetch origin
          git -C $env:VCPKG_ROOT checkout --detach e6f9e70a29a3e80a1fc510d8503304315447112f
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          cmake --preset win-x64-release
          cmake --build build/win-x64-release --config RelWithDebInfo --target equora_capi_tests

      - name: Run under cdb to capture crash stack
        working-directory: native
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $exe = 'build\win-x64-release\Schedule.CApi.Tests\RelWithDebInfo\equora_capi_tests.exe'
          & $cdb -g -G -lines -c 'g; kv 30; lmvm equora_capi; q' $exe --gtest_filter=CApiTest.SchemaVersionAfterCreate
