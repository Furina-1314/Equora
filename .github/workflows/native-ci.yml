name: native-ci

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-ci.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-ci.yml']
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows x64 (MSVC + vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # job 级 env 不能引用 env 上下文;vcpkg 路径在步骤内运行时解析。
      - name: Configure
        working-directory: native
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) {
            $env:VCPKG_ROOT = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          }
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          cmake --preset win-x64-release

      - name: Build
        working-directory: native
        run: cmake --build --preset win-x64-release

      - name: Test
        working-directory: native
        run: ctest --preset win-x64-release
